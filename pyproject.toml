[project]
name = "moberg-h5"
version = "0.1.1"
description = "Read HDF5 files exported from Moberg CNS archives"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Moberg Analytics", email = "info@moberganalytics.com" }]
requires-python = ">=3.10"
keywords = ["hdf5", "eeg", "neuromonitoring", "moberg", "physiological signals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "h5py>=3.8",
    "numpy>=1.23",
]

[project.urls]
Homepage = "https://github.com/moberg-analytics/moberg-h5"
Documentation = "https://github.com/moberg-analytics/moberg-h5/blob/main/docs/hdf5-format.md"
Changelog = "https://github.com/moberg-analytics/moberg-h5/blob/main/CHANGELOG.md"
Issues = "https://github.com/moberg-analytics/moberg-h5/issues"

[project.optional-dependencies]
pandas = ["pandas>=1.5"]

[dependency-groups]
dev = [
    "ipython-icat>=0.5.0",
    "pandas>=1.5",
    "pytest>=8",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [".agents", ".claude", ".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/moberg_h5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
